version: 0.1.0
worklog:
  committed: true                 # worklog/<{{ID_PREFIX}}-NNN>/ is committed (locked decision)
guardrails:
  # always_on is empty on a fresh project: a new repo has no invariants to
  # protect yet. Author one guardrail per invariant with `flow guardrail add
  # <name>` (see guardrails/always-on/README.md), then list its name here so
  # the guardrail-verifier enforces it at Build/verify.
  always_on: []
  optional:  [security-baseline, resiliency-baseline, test-coverage, dependency-provenance]
commands:                      # your project's shell commands; flow init fills these
  test: "{{TEST_CMD}}"         # e.g. make test | npm test | pytest
  build: "{{BUILD_CMD}}"       # e.g. make build | npm run build
  lint: "{{LINT_CMD}}"         # e.g. make lint | ruff check
  typecheck: "{{TYPECHECK_CMD}}"  # e.g. mypy | tsc --noEmit  (optional)
vcs:
  base: "{{BASE_BRANCH}}"   # default base branch for feature branches + PR target (per-task override: "Base branch:" in progress.md)
tracker:
  platform: "{{TRACKER_PLATFORM}}"   # github|jira|linear|azure-devops|shortcut|asana|clickup (default: github)
  mcp: "{{TRACKER_MCP}}"
  repo: "{{TRACKER_REPO}}"
  id_scheme: "{{ID_PREFIX}}-{n}"   # expands to {{ID_PREFIX}}- + the tracker issue number, no zero-padding; worklog dir is {{ID_PREFIX}}-<n>-<slug>
  create:
    dedupe: true
    required_labels: [type, priority, area]
    ticket_types: [bug, feat, task, epic]   # classified in Scope/clarify; epic -> parent + child sub-issues
    priority_scheme: [P0, P1, P2, P3]        # keep body Severity, the priority label, and the tracker priority field in sync
    epic_children: sub_issues                # create an Epic parent + child stubs, linked via the tracker's sub-issue link
knowledge:
  map_index: knowledge/map/README.md          # curated Knowledge Map — Scope/Shape read it for grounding (see steps/shared/knowledge-map.md)
  map_machine_index: .flow/knowledge-map.yaml  # derives-from globs for naming affected file(s)/module(s)

review:
  branch_hardening:              # pr-review-toolkit agents run at Ship/branch-hardening (whole-branch, pre-PR)
    - pr-review-toolkit:code-reviewer
    - pr-review-toolkit:silent-failure-hunter
    - pr-review-toolkit:pr-test-analyzer
    - pr-review-toolkit:type-design-analyzer
    - pr-review-toolkit:comment-analyzer

graph:
  backend: graphify              # code-graph backend — see steps/shared/graph.md. Swappable via the graph adapter; Graphify by default.
  mcp: graphify                  # MCP server agents query for structure (universal ops -> its tools via the adapter)
  output: graphify-out/graph.json
  build: "graphify extract . --code-only --no-cluster --force"   # canonical, deterministic, offline (dev == CI)
  code_only: true
  root: "."                      # single directed extract at repo root
  focus: []                      # your product-code dirs (e.g. src, app, lib) — set these after adding code; C7 checks they exist
  committed: true
  # A project with vendored/generated trees to exclude may add a `.graphifyignore`
  # file and set `ignore_file: .graphifyignore` here (C7 requires it to exist if set).
