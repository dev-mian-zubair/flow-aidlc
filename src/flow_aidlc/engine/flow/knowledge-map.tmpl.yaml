# Knowledge map — links each knowledge/map/ doc to the source paths it derives
# from, so `flow refresh` can re-derive stale docs from current code.
#
# This starts EMPTY. Populate it with `flow map add <doc> <glob>...`, which
# appends a maps[] entry pairing a knowledge/map/<name>.md doc with the
# code globs it summarizes.
maps: []

# Design standards (optional, Impeccable): if present, Scope/Shape read these for
# grounding so intent + design reflect the product's design language.
design_standards:
  - PRODUCT.md   # audience, brand, voice, anti-references
  - DESIGN.md    # the design system / standards
