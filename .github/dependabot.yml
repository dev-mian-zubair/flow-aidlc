version: 2
updates:
  # GitHub Actions used by ci.yml / release.yml (checkout, setup-uv, artifacts,
  # gh-action-pypi-publish). Grouped into one PR to limit noise.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies declared in pyproject.toml (runtime + dev extras).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      python:
        patterns: ["*"]
